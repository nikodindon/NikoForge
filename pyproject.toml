[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nikoforge"
description = "Agent de coding local, exécuté sur un serveur compatible OpenAI (llama-server)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "nikodindon" }]
license = { text = "MIT" }
keywords = ["agent", "llm", "coding-agent", "llama.cpp", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["openai>=1.0.0"]
# Source unique de vérité pour la version : `nikoforge/__init__.py`.
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",  # client de test pour le faux serveur OpenAI-compatible
]

[project.scripts]
nikoforge = "nikoforge.cli:main"

[project.urls]
Repository = "https://github.com/nikodindon/NikoForge"
Changelog = "https://github.com/nikodindon/NikoForge/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["nikoforge"]

[tool.setuptools.dynamic]
version = { attr = "nikoforge.__version__" }

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "known_issue: documente un comportement identifie comme un bug (voir docs/REFONTE.md). A inverser ou supprimer en phase 3.",
    "integration: necessite un veritable serveur llama-server. Desactive par defaut.",
]

# --------------------------------------------------------------------------- #
# ruff
# Selection volontairement minimale en phase 2 : uniquement les erreurs reelles
# (imports casses, noms indefinis, erreurs de syntaxe au niveau module).
# La phase 6 elargit a E, W, F, I, UP, B et exige zero erreur.
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py311"
line-length = 100
# `examples/` contient du code de demonstration genere par l'agent : hors perimetre du produit.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# --------------------------------------------------------------------------- #
# mypy
# Non strict en phase 2 : le code n'est pas encore annote.
# La phase 6 resserre (check_untyped_defs, disallow_untyped_defs).
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["nikoforge"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
